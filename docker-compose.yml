services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shelfmate
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shelfmate
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  search:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng

volumes:
  pgdata: