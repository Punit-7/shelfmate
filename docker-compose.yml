# Each container's log is capped at 3 files of 10 MB, so the disk cannot fill up.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shelfmate
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shelfmate
    ports:
      - "127.0.0.1:5433:5432"  # local only, like SearXNG
    volumes:
      - pgdata:/var/lib/postgresql/data

  search:
    image: searxng/searxng:2026.10.17-2a6fc07be
    ports:
      - "127.0.0.1:8080:8080"  # SearXNG has no login, so keep it off the network
    volumes:
      - ./searxng:/etc/searxng

  api:
    build: .
    command: uvicorn shelfmate.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment: &in-docker
      # .env points at localhost for running on Windows. Inside Docker, services are
      # found by name, and Ollama runs on the Windows host.
      DATABASE_URL: postgresql+psycopg://shelfmate:${DB_PASSWORD}@db:5432/shelfmate
      SEARXNG_URL: http://search:8080
      OLLAMA_URL: http://host.docker.internal:11434
      API_URL: http://api:8000
      HF_HOME: /cache/huggingface
      # Prefect starts a temporary server for each flow run. In a container it needs longer than the default 30 seconds.
      PREFECT_SERVER_EPHEMERAL_STARTUP_TIMEOUT_SECONDS: "300"
    ports:
      - "127.0.0.1:8000:8000"
    volumes: &app-volumes
      - ./logs:/app/logs
      - models:/cache/huggingface  # the embedding model, downloaded once
    depends_on: [db, search]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  runner:
    build: .
    command: python -m shelfmate.flows.runner  # runs the recommendation flow when the API asks
    env_file: .env
    environment: *in-docker
    volumes: *app-volumes
    depends_on: [db]
    restart: unless-stopped
    logging: *default-logging

  worker:
    build: .
    command: python -m shelfmate.flows.weekly
    env_file: .env
    environment: *in-docker
    volumes: *app-volumes
    depends_on: [db]
    restart: unless-stopped
    logging: *default-logging

  site:
    build: ./site
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"  # local only, like the other services
    depends_on: [api]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

volumes:
  pgdata:
  models:
