services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: shelfmate
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: shelfmate
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  search:
    image: searxng/searxng:2026.10.17-2a6fc07be
    ports:
      - "127.0.0.1:8080:8080"  # SearXNG has no login, so keep it off the network
    volumes:
      - ./searxng:/etc/searxng

volumes:
  pgdata: