[project]
name = "shelfmate"
version = "0.1.0"
description = "Book recommender: hybrid collaborative and content-based, with series-aware lanes."
readme = "README.md"
authors = [
    { name = "Punit", email = "punit251299@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.2",
    "httpx>=0.28.1",
    "implicit>=0.7.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.16",
    "pandas>=3.0.6",
    "pgvector>=0.5.1",
    "prefect>=3.8.8",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "sentence-transformers>=6.1.0",
    "sqlalchemy>=2.1.4",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mlflow>=3.17.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
